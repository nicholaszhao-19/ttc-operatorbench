[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ttc-operatorbench"
version = "0.1.0"
description = "Experimental harness for TTC operator benchmark research."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
  { name = "TTC OperatorBench contributors" },
]
dependencies = [
  "datasets",
  "duckdb",
  "matplotlib",
  "pandas",
  "pyarrow",
  "pydantic",
  "rich",
  "torch",
  "transformers",
  "typer",
]

[project.scripts]
ttc-operatorbench = "ttc_operatorbench.cli:app"

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ttc_operatorbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "B",
  "E",
  "F",
  "I",
  "UP",
  "W",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
mypy_path = "src"
files = ["src", "tests"]
