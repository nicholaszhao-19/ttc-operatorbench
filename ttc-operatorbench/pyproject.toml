[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ttc-operatorbench"
version = "0.1.0"
description = "Auditable harness for test-time compute operator allocation in verifier-guided code reasoning."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
  { name = "Nicholas Zhao" },
]
dependencies = [
  "matplotlib",
  "pydantic",
  "pyyaml",
  "typer",
]

[project.urls]
Repository = "https://github.com/nicholaszhao-19/ttc-operatorbench"

[project.optional-dependencies]
analysis = [
  "duckdb",
  "pandas",
  "pyarrow",
  "rich",
]
hf = [
  "datasets",
  "torch",
  "transformers",
]

[project.scripts]
ttc-operatorbench = "ttc_operatorbench.cli:app"

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "ruff",
  "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ttc_operatorbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "B",
  "E",
  "F",
  "I",
  "UP",
  "W",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
mypy_path = "src"
files = ["src", "tests"]
