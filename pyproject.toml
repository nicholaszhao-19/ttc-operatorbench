[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ttc-operatorbench"
version = "0.1.0"
description = "Reproducible evaluation harness for code-generation test-time compute."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
keywords = [
  "code-generation",
  "evaluation",
  "test-time-compute",
  "verifier-guided-search",
]
authors = [
  { name = "TTC OperatorBench contributors" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "matplotlib",
  "pydantic",
  "typer",
]

[project.scripts]
ttc-operatorbench = "ttc_operatorbench.cli:app"

[project.urls]
Homepage = "https://github.com/nicholaszhao-19/ttc-operatorbench"
Issues = "https://github.com/nicholaszhao-19/ttc-operatorbench/issues"
Repository = "https://github.com/nicholaszhao-19/ttc-operatorbench"

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "ruff",
]
hf = [
  "torch",
  "transformers",
]
evalplus = [
  "evalplus==0.3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ttc_operatorbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--strict-config",
  "--strict-markers",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "B",
  "E",
  "F",
  "I",
  "UP",
  "W",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"
files = ["src", "tests"]
